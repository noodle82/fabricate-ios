workflows:
  ios-simulator-beta:
    name: FABRICATE iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          node scripts/prepare-ios.mjs
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Build simulator
        script: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - build/DerivedData/Build/Products/Debug-iphonesimulator/*.app

  ios-testflight:
    name: FABRICATE TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: bluffle_apple
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fabricategame.app
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install --no-audit --no-fund
      - name: Generate iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          node scripts/prepare-ios.mjs
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: |
          cd ios/App
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Build signed app
        script: xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
